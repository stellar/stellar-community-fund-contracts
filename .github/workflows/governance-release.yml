name: Build and Release Governance Contract

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-governance:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: 'Governance contract release'
      relative_path: 'contracts'
      package: 'governance'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  delete-trigger-tag:
    needs: release-governance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete trigger tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${GITHUB_REF_NAME}"